<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Split - Log In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-animation" id="bgCanvas"></div>

  <div class="card form-card">
    <a href="index.html" class="back-link">← Back to Main</a>

    <div class="logo-container header-compact">
      <h2 class="brand-title">MONEY SPLIT</h2>
      <p class="tagline">Sign in to manage your balances</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Login submitted!');">
      <div class="form-group">
        <label for="email">Email or Username</label>
        <input type="email" id="email" placeholder="enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-pwd">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="card-footer">
      <p>Don't have an account? <a href="create_account.html">Create One</a></p>
    </div>
  </div>

  <script>
    const canvas = document.createElement('canvas');
    document.getElementById('bgCanvas').appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

    const symbols = ['$', '€', '£', '¥', '₿', '✦'];
    const particles = [];
    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * width, y: Math.random() * height,
        size: Math.random() * 16 + 10, symbol: symbols[Math.floor(Math.random() * symbols.length)],
        speedY: -(Math.random() * 1.0 + 0.2), speedX: Math.random() * 0.4 - 0.2,
        opacity: Math.random() * 0.4 + 0.15, angle: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.02
      });
    }
    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y += p.speedY; p.x += p.speedX; p.angle += p.spin;
        if (p.y < -30) { p.y = height + 30; p.x = Math.random() * width; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
        ctx.font = `${p.size}px serif`; ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.shadowColor = '#D4AF37'; ctx.shadowBlur = 6; ctx.fillText(p.symbol, 0, 0); ctx.restore();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
