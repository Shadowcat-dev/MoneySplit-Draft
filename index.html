<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Split - Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-animation" id="bgCanvas"></div>

  <div class="card">
    <div class="logo-container">
      <div class="mascot-wrapper" style="border-radius: 50%; overflow: hidden; border: 2px solid #D4AF37; width: 140px; height: 140px;"> 
      <img src="https://raw.githubusercontent.com/Shadowcat-dev/MoneySplit-Draft/refs/heads/main/Money%20split%20Pig%20logo.png" alt="Money Split Mascot" style="width: 100%; height: 100%; object-fit: cover;"[cite: 10]> 
      </div>
      <h1 class="brand-title">MONEY SPLIT</h1>
      <p class="tagline">Smart & Luxurious Expense Sharing</p>
    </div>

    <div class="button-group">
      <a href="login.html" class="btn btn-primary">Log In</a>
      <a href="create_account.html" class="btn btn-secondary">Create Account</a>
    </div>
  </div>

  <script>
    // Particle Money Stream Animation
    const canvas = document.createElement('canvas');
    document.getElementById('bgCanvas').appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const symbols = ['$', '€', '£', '¥', '₿', '✦', '✧'];
    const particles = [];

    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 18 + 12,
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        speedY: -(Math.random() * 1.2 + 0.3),
        speedX: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.5 + 0.2,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.02
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.angle += p.spin;

        if (p.y < -30) {
          p.y = height + 30;
          p.x = Math.random() * width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.font = `${p.size}px 'Cinzel', serif, sans-serif`;
        ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.shadowColor = '#D4AF37';
        ctx.shadowBlur = 8;
        ctx.fillText(p.symbol, 0, 0);
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
