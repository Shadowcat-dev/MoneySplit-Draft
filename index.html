<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Split - Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-animation" id="bgCanvas"></div>

  <div class="card">
    <div class="logo-container">
      <div class="mascot-wrapper">
        <svg viewBox="0 0 200 220" class="pig-mascot">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE57F"/>
              <stop offset="50%" stop-color="#D4AF37"/>
              <stop offset="100%" stop-color="#AA771C"/>
            </linearGradient>
            <linearGradient id="darkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#AA771C"/>
              <stop offset="100%" stop-color="#553B0E"/>
            </linearGradient>
            <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#2A2A2E"/>
              <stop offset="100%" stop-color="#121214"/>
            </linearGradient>
          </defs>

          <!-- Top Hat -->
          <ellipse cx="100" cy="42" rx="45" ry="8" fill="url(#darkGoldGrad)" />
          <path d="M 68,40 L 72,12 C 72,12 100,5 128,12 L 132,40 Z" fill="url(#darkGoldGrad)" />
          <rect x="71" y="32" width="58" height="7" fill="url(#goldGrad)" />
          <!-- Hat Gold Feather/Accent -->
          <path d="M 120,33 Q 135,20 138,10" stroke="url(#goldGrad)" stroke-width="3" fill="none" />

          <!-- Pig Head (Standing Dapper Pig) -->
          <ellipse cx="100" cy="72" rx="38" ry="32" fill="#1E1E22" stroke="url(#goldGrad)" stroke-width="3"/>
          
          <!-- Cute Pig Ears -->
          <path d="M 66,55 Q 50,32 60,25 Q 75,40 73,50" fill="#1E1E22" stroke="url(#goldGrad)" stroke-width="2"/>
          <path d="M 134,55 Q 150,32 140,25 Q 125,40 127,50" fill="#1E1E22" stroke="url(#goldGrad)" stroke-width="2"/>

          <!-- Eyes & Monocle -->
          <circle cx="82" cy="68" r="4" fill="url(#goldGrad)" />
          <circle cx="118" cy="68" r="4" fill="url(#goldGrad)" />
          <!-- Monocle right eye -->
          <circle cx="118" cy="68" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
          <path d="M 125,74 Q 135,90 128,110" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2 2"/>

          <!-- Snout -->
          <ellipse cx="100" cy="78" rx="14" ry="9" fill="#121214" stroke="url(#goldGrad)" stroke-width="2"/>
          <circle cx="94" cy="78" r="2.5" fill="url(#goldGrad)"/>
          <circle cx="106" cy="78" r="2.5" fill="url(#goldGrad)"/>

          <!-- Dapper Suit & Body (Standing on two legs) -->
          <!-- Body / Suit Jacket -->
          <path d="M 68,102 C 60,120 55,165 65,190 L 135,190 C 145,165 140,120 132,102 Z" fill="url(#suitGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
          
          <!-- Shirt & Bowtie -->
          <polygon points="100,102 85,130 115,130" fill="#F0F0F0" />
          <path d="M 90,108 L 100,114 L 110,108 L 105,118 L 110,124 L 100,118 L 90,124 L 95,118 Z" fill="url(#goldGrad)"/>

          <!-- Legs -->
          <rect x="75" y="190" width="16" height="22" rx="4" fill="#121214" stroke="url(#goldGrad)" stroke-width="2"/>
          <rect x="109" y="190" width="16" height="22" rx="4" fill="#121214" stroke="url(#goldGrad)" stroke-width="2"/>

          <!-- Cane (Leaning on cane) -->
          <!-- Left Arm holding cane -->
          <path d="M 66,115 Q 45,135 48,160" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
          <!-- Gold Cane -->
          <path d="M 46,120 L 46,210" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
          <path d="M 40,120 C 40,108 52,108 52,120" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
        </svg>
      </div>
      <h1 class="brand-title">MONEY SPLIT</h1>
      <p class="tagline">Smart & Luxurious Expense Sharing</p>
    </div>

    <div class="button-group">
      <a href="login.html" class="btn btn-primary">Log In</a>
      <a href="create_account.html" class="btn btn-secondary">Create Account</a>
    </div>
  </div>

  <script>
    // Particle Money Stream Animation
    const canvas = document.createElement('canvas');
    document.getElementById('bgCanvas').appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const symbols = ['$', '€', '£', '¥', '₿', '✦', '✧'];
    const particles = [];

    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 18 + 12,
        symbol: symbols[Math.floor(Math.random() * symbols.length)],
        speedY: -(Math.random() * 1.2 + 0.3),
        speedX: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.5 + 0.2,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.02
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.angle += p.spin;

        if (p.y < -30) {
          p.y = height + 30;
          p.x = Math.random() * width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.font = `${p.size}px 'Cinzel', serif, sans-serif`;
        ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.shadowColor = '#D4AF37';
        ctx.shadowBlur = 8;
        ctx.fillText(p.symbol, 0, 0);
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
